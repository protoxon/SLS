# Start one role per host with a profile:
#   docker compose --profile controller up -d
#   docker compose --profile daemon up -d
x-sls: &sls
  image: ghcr.io/protoxon/sls:latest
  build:
    context: .
    dockerfile: Dockerfile
    args:
      VERSION: v0.1.2
  restart: always
  tty: true
  extra_hosts:
    - "host.docker.internal:host-gateway"
    - "controller.sls.net:host-gateway"
    - "daemon.sls.net:host-gateway"
  networks:
    - sls

services:
  controller:
    <<: *sls
    profiles: [controller]
    container_name: SLS
    command: ["run", "controller", "--config", "/etc/sls/controller/config.yml"]
    ports:
      - "5620:5620"
    environment:
      TZ: "UTC"
    volumes:
      - "/etc/sls/controller/:/etc/sls/controller/"
      - "/var/lib/sls/:/var/lib/sls/"
      - "/var/log/sls/controller/:/var/log/sls/controller/"
      - "/tmp/sls/controller/:/tmp/sls/controller/"
      - "/etc/ssl/certs:/etc/ssl/certs:ro"

  daemon:
    <<: *sls
    profiles: [daemon]
    command: ["run", "daemon", "--config", "/etc/sls/daemon/config.yml"]
    # Overlay mounts (used for server filesystems) need one of:
    # - userns_mode: host (when Docker uses userns-remap, container root cannot mount)
    # - apparmor=unconfined (Docker's default AppArmor profile can deny mount)
    userns_mode: "host"
    # Heartbeat memory.current / memory.peak are read from the host cgroup
    # tree via the game container's host pid. Without these the daemon
    # samples 0 and the scheduler charges every server its full limit.
    pid: host
    cgroup: host
    security_opt:
      - apparmor=unconfined
    cap_add:
      - SYS_ADMIN
    ports:
      - "5585:5585"
    environment:
      TZ: "UTC"
      SLS_UID: 988
      SLS_GID: 988
      SLS_USERNAME: sls
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/lib/docker/containers/:/var/lib/docker/containers/"
      - "/etc/sls/daemon/:/etc/sls/daemon/"
      - "/var/log/sls/daemon/:/var/log/sls"
      - "/tmp/sls/daemon/:/tmp/sls/daemon"
      - "/etc/ssl/certs:/etc/ssl/certs:ro"

      # rshared propagation is required so overlay mounts created by the daemon at
      # /var/lib/sls/data/<server-id> propagate to the host. Server containers are
      # given a bind mount of that path by the host Docker daemon; without propagation
      # the host never sees the overlay and server containers get an empty directory
      - type: bind
        source: /var/lib/sls
        target: /var/lib/sls
        bind:
          propagation: rshared
          create_host_path: true

networks:
  sls:
    name: sls
    driver: bridge
    ipam:
      config:
        - subnet: "172.30.0.0/16"
    driver_opts:
      com.docker.network.bridge.name: sls
